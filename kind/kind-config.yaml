# Host ports 13306/15432 map to the MySQL/Postgres NodePorts (30306/30432); ngrok tunnels them to Confluent Cloud.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - { containerPort: 30306, hostPort: 13306, listenAddress: "127.0.0.1", protocol: TCP }
  - { containerPort: 30432, hostPort: 15432, listenAddress: "127.0.0.1", protocol: TCP }
