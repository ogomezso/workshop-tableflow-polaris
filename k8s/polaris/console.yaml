# Polaris Console (optional UI). Image polaris-console:local is built by `make console-image` (scripts/build-console.sh).
# The VITE_* URLs are the ones the BROWSER uses: the Console's own origin, reached with `make polaris-console-forward`.
# Its nginx proxies /api/ to Polaris, so there is no CORS setup.
apiVersion: apps/v1
kind: Deployment
metadata: { name: polaris-console }
spec:
  replicas: 1
  selector: { matchLabels: { app: polaris-console } }
  template:
    metadata: { labels: { app: polaris-console } }
    spec:
      containers:
      - name: console
        image: polaris-console:local
        imagePullPolicy: IfNotPresent
        ports: [ { containerPort: 8080 } ]
        env:
        - { name: VITE_POLARIS_API_URL, value: "http://localhost:8080" }
        - { name: VITE_OAUTH_TOKEN_URL, value: "http://localhost:8080/api/catalog/v1/oauth/tokens" }
        - { name: VITE_POLARIS_REALM, value: POLARIS }
        - { name: VITE_POLARIS_REALM_HEADER_NAME, value: Polaris-Realm }
        - { name: VITE_POLARIS_PRINCIPAL_SCOPE, value: "PRINCIPAL_ROLE:ALL" }
        readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: polaris-console }
spec:
  selector: { app: polaris-console }
  ports: [ { name: http, port: 8080, targetPort: 8080 } ]
